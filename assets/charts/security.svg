<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<title>四层安全闸门</title>
<rect width="1240" height="600" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">四层安全：一次调用必须依次闯过的闸门</text>
<text x="40" y="80" font-size="14" fill="#64748b">全部通过 → 真实执行并统计；任一失败 → 统一返回 ToolResult.fail()，绝不带病执行</text>
<rect x="250" y="112" width="260" height="44" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="140" font-size="14" fill="#0f172a" font-weight="600" text-anchor="middle">registry.call(name, params)</text>
<rect x="230" y="180" width="300" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="202" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">① 工具存在性</text>
<text x="380" y="221" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">name 不在注册表 → 工具未注册</text>
<line x1="380" y1="156" x2="380" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="530" y1="206" x2="750" y2="206" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ah-red)"/><text x="542" y="199" font-size="11" fill="#dc2626" font-weight="400" text-anchor="start">fail</text>
<rect x="230" y="248" width="300" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="270" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">② 权限校验</text>
<text x="380" y="289" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">user_level.rank() &lt; 工具要求 → 权限不足</text>
<line x1="380" y1="232" x2="380" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="530" y1="274" x2="750" y2="274" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ah-red)"/><text x="542" y="267" font-size="11" fill="#dc2626" font-weight="400" text-anchor="start">fail</text>
<rect x="230" y="316" width="300" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="338" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">③ 危险命令黑名单</text>
<text x="380" y="357" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">rm -rf / 等命中 → 拒绝执行（空白归一化防绕过）</text>
<line x1="380" y1="300" x2="380" y2="306" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="530" y1="342" x2="750" y2="342" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ah-red)"/><text x="542" y="335" font-size="11" fill="#dc2626" font-weight="400" text-anchor="start">fail</text>
<rect x="230" y="384" width="300" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="406" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">④ 受保护路径拦截</text>
<text x="380" y="425" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">/etc、/usr、C:\Windows 等全入口拦截 → 受保护</text>
<line x1="380" y1="368" x2="380" y2="374" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="530" y1="410" x2="750" y2="410" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ah-red)"/><text x="542" y="403" font-size="11" fill="#dc2626" font-weight="400" text-anchor="start">fail</text>
<rect x="230" y="452" width="300" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="474" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">⑤ 参数 schema 预检</text>
<text x="380" y="493" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">缺参/类型错 → 参数错误</text>
<line x1="380" y1="436" x2="380" y2="442" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="530" y1="478" x2="750" y2="478" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ah-red)"/><text x="542" y="471" font-size="11" fill="#dc2626" font-weight="400" text-anchor="start">fail</text>
<rect x="760" y="200" width="320" height="280" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="920" y="244" font-size="15" fill="#dc2626" font-weight="700" text-anchor="middle">ToolResult(success=False)</text>
<text x="920" y="276" font-size="12.5" fill="#dc2626" font-weight="400" text-anchor="middle">error 带分类前缀：</text>
<text x="920" y="298" font-size="12.5" fill="#dc2626" font-weight="400" text-anchor="middle">工具未注册 / 权限不足 / 参数错误 /</text>
<text x="920" y="320" font-size="12.5" fill="#dc2626" font-weight="400" text-anchor="middle">拒绝执行 / 受保护 —— 组3 读前缀即可自愈</text>
<text x="920" y="352" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">· 拦截发生在统计之前，不产生调用记录</text>
<text x="920" y="374" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">· 黑名单与保护路径即使 ADMIN 提权也拦截</text>
<line x1="380" y1="504" x2="380" y2="520" stroke="#16a34a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="210" y="530" width="340" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="380" y="548" font-size="13.5" fill="#16a34a" font-weight="700" text-anchor="middle">执行真实工具函数 → 计时 → stats.record()</text>
<text x="380" y="566" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">统计在执行之后：成功与失败（工具内部）都如实落盘</text>
</svg>
