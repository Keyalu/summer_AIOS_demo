<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<title>命令流转路线</title>
<rect width="1240" height="540" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">一次 run_command 调用的完整流转（8 步）</text>
<text x="40" y="80" font-size="14" fill="#64748b">以 registry.call("run_command", {"cmd": "echo hello"}) 为例，对应 presentation/04 讲解路线</text>
<text x="185" y="118" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">main.py</text>
<line x1="60" y1="126" x2="290" y2="126" stroke="#e2e8f0" stroke-width="3"/>
<text x="185" y="146" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">调用入口（组3 同样写法）</text>
<text x="530" y="118" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">tool_registry.py</text>
<line x1="400" y1="126" x2="640" y2="126" stroke="#e2e8f0" stroke-width="3"/>
<text x="530" y="146" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">调度中枢：检查 + 计时 + 统计</text>
<text x="880" y="118" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">default_tools.py</text>
<line x1="760" y1="126" x2="980" y2="126" stroke="#e2e8f0" stroke-width="3"/>
<text x="880" y="146" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">真实执行：黑名单 → subprocess</text>
<text x="1155" y="118" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">组3 / 演示输出</text>
<line x1="1050" y1="126" x2="1240" y2="126" stroke="#e2e8f0" stroke-width="3"/>
<text x="1155" y="146" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">拿到统一返回</text>
<rect x="60" y="190" width="250" height="62" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="74" y="215" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">1. 发起调用</text>
<text x="74" y="237" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">registry.call(name, params, user_level)</text>
<rect x="400" y="190" width="260" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="414" y="215" font-size="13.5" fill="#2563eb" font-weight="700" text-anchor="start">2. 存在性检查</text>
<text x="414" y="237" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">name 在 _tools 字典中？</text>
<rect x="400" y="270" width="260" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="414" y="295" font-size="13.5" fill="#2563eb" font-weight="700" text-anchor="start">3. 权限比较</text>
<text x="414" y="317" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">user_level.rank() &gt;= tool rank ?</text>
<rect x="400" y="350" width="260" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="414" y="375" font-size="13.5" fill="#2563eb" font-weight="700" text-anchor="start">4. 解包执行</text>
<text x="414" y="397" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">self._tools[name](**params)</text>
<rect x="760" y="190" width="240" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="774" y="215" font-size="13.5" fill="#d97706" font-weight="700" text-anchor="start">5. 黑名单检查</text>
<text x="774" y="237" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">空白归一化后匹配危险命令</text>
<rect x="760" y="270" width="240" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="774" y="295" font-size="13.5" fill="#16a34a" font-weight="700" text-anchor="start">6. OS 级执行</text>
<text x="774" y="317" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">subprocess.run(cmd, timeout)</text>
<rect x="760" y="350" width="240" height="62" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="774" y="375" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">7. 原始返回</text>
<text x="774" y="397" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">{"success": True, "result": "hello\n"}</text>
<rect x="400" y="440" width="260" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="414" y="465" font-size="13.5" fill="#2563eb" font-weight="700" text-anchor="start">8. 计时+统计+包装</text>
<text x="414" y="487" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">stats.record() → ToolResult.to_dict()</text>
<path d="M 310 221 C 350 221, 360 221, 400 221" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="530" y1="252" x2="530" y2="262" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="530" y1="332" x2="530" y2="342" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 660 381 C 700 381, 720 221, 760 221" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="880" y1="252" x2="880" y2="262" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="880" y1="332" x2="880" y2="342" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 760 381 C 800 381, 620 470, 660 470" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 400 471 C 440 471, 270 240, 310 240" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="400" y="528" font-size="12.5" fill="#16a34a" font-weight="600" text-anchor="start">最终统一返回：ToolResult.to_dict() = {success, result/error}</text>
</svg>
